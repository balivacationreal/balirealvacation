<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Page Not Found | Bali Real Vacation</title>
    <link rel="icon" type="image/webp" href="src/assets/bali-real-vacation-logo.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root{--primary-color:#005B96;--secondary-color:#FF7F50;--font-heading:'Montserrat',sans-serif;--font-body:'Open Sans',sans-serif}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--font-body);background-color:#F8F9FA;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
        h1{font-family:var(--font-heading);font-size:8rem;color:var(--primary-color);margin:0;line-height:1}
        h2{font-family:var(--font-heading);font-size:2rem;color:#333;margin-top:10px;margin-bottom:20px}
        p{font-size:1.1rem;color:#666;max-width:500px;margin-bottom:40px;line-height:1.6}
        .btn{background-color:var(--secondary-color);color:#fff;padding:15px 35px;text-decoration:none;border-radius:30px;font-family:var(--font-heading);font-weight:700;font-size:1.1rem;transition:background .3s,transform .2s}
        .btn:hover{background-color:#e66b3b;transform:translateY(-2px)}
        @media(max-width:480px){h1{font-size:5rem}h2{font-size:1.5rem}}
    </style>
</head>
<body>
    <h1>404</h1>
    <h2>Oops! You've wandered off the map.</h2>
    <p>The page you are looking for might have been moved, renamed, or is temporarily unavailable. But don't worry — we know plenty of hidden gems in Bali!</p>

</body>
</html>
