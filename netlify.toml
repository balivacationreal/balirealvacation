# ============================================================
#  Bali Real Vacation — Netlify configuration
#  Goal: ONE canonical URL per page so Google stops seeing
#  "Page with redirect" / duplicate-canonical errors.
#  Canonical form chosen:  https://balirealvacation.com/<page>.html
#  (non-www, keeps .html — matches what Google already indexed)
# ============================================================

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# ----- Serverless functions ----------------------------------
# Backs the <visitor-globe> card on the three homepages. The route
# itself is declared in the function (`export const config = { path }`),
# so there is no redirect to keep in sync here.
#
# Only top-level files in this directory become endpoints; the shared
# logic lives in netlify/functions/lib/, which is bundled as a plain
# import and is not reachable over HTTP. Its tests are in test/, out of
# the directory entirely, so they are never deployed.
#
# Storage is Netlify Blobs (store "visitor-globe"), which needs no
# configuration. Geolocation comes from context.geo at the edge, so no
# visitor IP ever leaves the function.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ----- 1. Force www -> non-www (301) -------------------------
# Every www request is permanently redirected to the apex domain.
[[redirects]]
  from = "https://www.balirealvacation.com/*"
  to = "https://balirealvacation.com/:splat"
  status = 301
  force = true

# ----- 2. Cache busting for static assets (BIG perf win) -----
# Images/fonts never change once published -> cache 1 year.
[[headers]]
  for = "/src/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should revalidate so edits go live immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS/JS revalidate for the same reason. These filenames are not fingerprinted,
# so caching them longer than the HTML ships new markup against old styles --
# which is how the nav dropdown once rendered as a flat, overflowing list.
# Both files are small and answer with a 304, so the cost is one cheap
# conditional request per visit.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ----- 3. Baseline security headers --------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ============================================================
#  IMPORTANT manual step in the Netlify dashboard:
#  Site settings -> Build & deploy -> Post processing
#    - Turn "Pretty URLs" OFF
#  Reason: with Pretty URLs ON, Netlify 301-redirects
#  /page.html -> /page, which fights your .html canonical
#  and re-creates the "Page with redirect" problem.
# ============================================================
